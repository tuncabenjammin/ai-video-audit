<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yapay Zeka Video Analizi — seekerz</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; background: #F8F7FF; color: #1B2B5E; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px 48px; }
  .wrap { width: 100%; max-width: 540px; }
  h1 { font-size: 24px; font-weight: 600; line-height: 1.3; color: #1B2B5E; }
  h2 { font-size: 18px; font-weight: 600; color: #1B2B5E; }
  h3 { font-size: 14px; font-weight: 500; color: #1B2B5E; }
  p  { font-size: 14px; line-height: 1.6; color: #64748b; }
  .card { background: #fff; border: 1px solid #e8e5ff; border-radius: 16px; padding: 24px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 500; color: #475569; margin-bottom: 6px; }
  input[type=text], input[type=email], input[type=url], input[type=password] { width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; color: #1B2B5E; background: #fff; outline: none; transition: border-color .2s; }
  input:focus { border-color: #E8196A; }
  input::placeholder { color: #94a3b8; }
  .form-group { margin-bottom: 14px; }
  .btn-pink { width: 100%; padding: 13px; background: #E8196A; color: #fff; border: none; border-radius: 11px; font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity .2s; }
  .btn-pink:hover { opacity: .9; }
  .btn-ghost { background: none; border: none; color: #94a3b8; font-size: 13px; cursor: pointer; padding: 8px; width: 100%; }
  .btn-ghost:hover { color: #64748b; }
  .tag { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .tag-green  { background: #ecfdf5; color: #065f46; }
  .tag-red    { background: #fef2f2; color: #991b1b; }
  .tag-purple { background: #f5f3ff; color: #4c1d95; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; }
  .score-inner { width: 80px; height: 80px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; flex-direction: column; position: absolute; }
  .score-num { font-size: 24px; font-weight: 700; color: #E8196A; }
  .score-sub { font-size: 10px; color: #94a3b8; }
  .presence-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .presence-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #475569; }
  .presence-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .dot-yes { background: #ecfdf5; color: #065f46; }
  .dot-no  { background: #fef2f2; color: #991b1b; }
  .idea-card { background: #fff; border: 1px solid #e8e5ff; border-left: 4px solid #E8196A; border-radius: 12px; padding: 16px; margin-bottom: 10px; }
  .idea-hook  { font-size: 12px; font-weight: 500; color: #E8196A; margin: 6px 0; }
  .idea-scene { font-size: 13px; color: #64748b; font-style: italic; background: #F8F7FF; border-radius: 8px; padding: 10px 12px; line-height: 1.6; margin: 6px 0; }
  .idea-why   { font-size: 12px; color: #94a3b8; margin-top: 6px; }
  .script-box { background: #F0EEFF; border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .script-box h3 { color: #1B2B5E; margin-bottom: 6px; }
  .script-box p  { color: #7B5EA7; font-size: 14px; }
  .cta-box { background: linear-gradient(135deg, #1B2B5E 0%, #7B5EA7 100%); border-radius: 16px; padding: 26px; text-align: center; margin-bottom: 12px; color: #fff; }
  .cta-box p { color: rgba(255,255,255,.75); margin-bottom: 16px; }
  .cta-box a { display: block; background: #E8196A; color: #fff; padding: 13px; border-radius: 10px; font-size: 15px; font-weight: 500; text-decoration: none; }
  .cta-box a:hover { opacity: .9; }
  .loading-wrap { text-align: center; padding: 60px 24px; }
  .dots { margin-bottom: 28px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin: 0 3px; animation: bounce 1.2s ease-in-out infinite; }
  .dot:nth-child(1) { background: #E8196A; }
  .dot:nth-child(2) { background: #7B5EA7; animation-delay: .2s; }
  .dot:nth-child(3) { background: #1B2B5E; animation-delay: .4s; }
  @keyframes bounce { 0%,80%,100%{transform:scale(.7);opacity:.5} 40%{transform:scale(1);opacity:1} }
  .progress-bar { height: 6px; border-radius: 3px; background: #F0EEFF; max-width: 320px; margin: 0 auto; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #E8196A, #7B5EA7); transition: width .5s ease; }
  .section-label { font-size: 11px; font-weight: 500; color: #94a3b8; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }
  .error-msg { color: #E8196A; font-size: 13px; margin-top: 6px; }
  .logo { font-size: 22px; font-weight: 700; color: #1B2B5E; letter-spacing: -.5px; }
  .logo span { color: #E8196A; }
  .header { text-align: center; margin-bottom: 28px; padding-top: 12px; }
  .badge-pill { display: inline-block; background: #F0EEFF; color: #7B5EA7; font-size: 11px; font-weight: 500; padding: 4px 12px; border-radius: 20px; margin-bottom: 16px; }
  .flex-row { display: flex; gap: 12px; align-items: flex-start; }
  .reasons-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .reasons-list li { display: flex; gap: 10px; font-size: 14px; color: #475569; line-height: 1.5; }
  .reason-num { color: #E8196A; font-weight: 600; flex-shrink: 0; }
  .pw-screen { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; }
  .pw-note { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
 
const APP_PASSWORD = 'seekerz2026';
const SEEKERZ_CTA = 'https://seekerz.vercel.app/sign-up?role=brand';
 
const LOADING_MSGS = ['Web siteniz inceleniyor...','Sosyal medya varlığınız aranıyor...','Video içerik durumunuz değerlendiriliyor...','Rakiplerinizle karşılaştırılıyor...','Yapay zeka videosu potansiyeli hesaplanıyor...','Kişiselleştirilmiş rapor hazırlanıyor...'];
 
const SYSTEM_PROMPT = `Sen bir dijital pazarlama uzmanısın. Verilen web sitesini analiz et. SADECE ham JSON döndür, { ile başla } ile bit, hiçbir açıklama veya markdown yazma.

JSON yapısı (kısa ve net tut):
{
  "score": 0-100,
  "summary": "2 cümle max. Markanın durumu ve fırsatı.",
  "reasons": ["neden 1 (1 cümle)", "neden 2 (1 cümle)", "neden 3 (1 cümle)"],
  "digital_presence": {"instagram":true,"tiktok":false,"youtube":false,"website_video":false,"active_ads":false},
  "video_ideas": [
    {"title": "Video başlığı", "platform": "TikTok/Reels", "concept": "Bu video ne anlatır ve neden bu marka için işe yarar — 2 cümle max."},
    {"title": "Video başlığı 2", "platform": "Instagram/YouTube", "concept": "Konsept — 2 cümle max."}
  ],
  "first_step": "1 cümle: hemen yapılacak ilk şey."
}`;
 
let state = { screen:'password', name:'', email:'', website:'', report:null, loadingIdx:0, progress:0, error:'' };
let loadingTimer = null;
 
function render() {
  const app = document.getElementById('app');
  if (state.screen==='password') app.innerHTML = renderPassword();
  else if (state.screen==='form') app.innerHTML = renderForm();
  else if (state.screen==='loading') app.innerHTML = renderLoading();
  else if (state.screen==='report') app.innerHTML = renderReport();
  attachHandlers();
}
 
function renderPassword() {
  return `<div class="pw-screen">
    <div class="header">
      <div class="logo">seeker<span>z</span></div>
      <div style="margin-top:8px"></div>
      <div class="badge-pill">✦ Özel Erişim</div>
      <h1 style="font-size:20px;margin-top:8px">Yapay zeka video analizi</h1>
      <p style="margin-top:6px;font-size:14px">Erişim şifresi ile devam edin</p>
    </div>
    <div class="card">
      <div class="form-group">
        <label>Erişim Şifresi</label>
        <input type="password" id="pwInput" placeholder="••••••••••" />
        ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
      </div>
      <button class="btn-pink" id="pwBtn">Devam Et →</button>
      <p class="pw-note">Bu araç seekerz tarafından sunulmaktadır. Verileriniz işlenmez.</p>
    </div>
  </div>`;
}
 
function renderForm() {
  return `<div class="header">
    <div class="logo">seeker<span>z</span></div>
    <div style="margin-top:10px"></div>
    <div class="badge-pill">✦ Ücretsiz Analiz</div>
    <h1>Yapay zeka ile üretilmiş videolara markanın da ihtiyacı var mı?</h1>
    <p style="margin-top:10px">Website linkini gir, biz analiz edelim. 2 dakikada öğren — ücretsiz.</p>
  </div>
  <div class="card">
    <div class="form-group"><label>Adın</label><input type="text" id="nameInput" placeholder="Ayşe Kaya" value="${state.name}" /></div>
    <div class="form-group"><label>Email adresin</label><input type="email" id="emailInput" placeholder="ayse@marka.com" value="${state.email}" /></div>
    <div class="form-group"><label>Markanın website linki</label><input type="url" id="websiteInput" placeholder="https://markan.com" value="${state.website}" /></div>
    ${state.error ? `<div class="error-msg" style="margin-bottom:10px">${state.error}</div>` : ''}
    <button class="btn-pink" id="analyzeBtn">Markanı Analiz Et →</button>
    <div style="display:flex;justify-content:center;gap:20px;margin-top:14px">
      ${['Ücretsiz','Spam yok','2 dakika'].map(t=>`<span style="font-size:12px;color:#94a3b8">✓ ${t}</span>`).join('')}
    </div>
  </div>`;
}
 
function renderLoading() {
  return `<div class="loading-wrap">
    <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <h2 style="margin-bottom:8px">Analiz yapılıyor</h2>
    <p id="loadingMsg" style="min-height:20px;margin-bottom:28px">${LOADING_MSGS[state.loadingIdx]}</p>
    <div class="progress-bar"><div class="progress-fill" style="width:${state.progress}%"></div></div>
    <p style="font-size:12px;color:#94a3b8;margin-top:10px">${Math.round(state.progress)}%</p>
  </div>`;
}
 
function renderReport() {
  const r = state.report;
  const dp = r.digital_presence || {};
  const hasNeed = r.score >= 50;
  const pItems = [{key:'instagram',label:'Instagram'},{key:'tiktok',label:'TikTok'},{key:'youtube',label:'YouTube'},{key:'website_video',label:'Sitede video'},{key:'active_ads',label:'Aktif reklam'}];
  return `<div class="header">
    <div class="logo">seeker<span>z</span></div>
    <p style="font-size:11px;color:#7B5EA7;font-weight:500;text-transform:uppercase;letter-spacing:.08em;margin-top:10px">Analiz Tamamlandı</p>
    <h2 style="margin-top:6px">${r.name} için Rapor</h2>
  </div>
  <div class="card"><div class="flex-row">
    <div class="score-ring" style="background:conic-gradient(#E8196A ${r.score}%, #F0EEFF ${r.score}%)">
      <div class="score-inner"><span class="score-num">${r.score}</span><span class="score-sub">/100</span></div>
    </div>
    <div style="flex:1">
      <span class="tag ${hasNeed?'tag-green':'tag-red'}" style="margin-bottom:8px;display:inline-block">${hasNeed?'✓ İhtiyaç var':'✗ Düşük ihtiyaç'}</span>
      <p>${r.summary}</p>
    </div>
  </div></div>
  <div class="card">
    <div class="section-label">Dijital Varlık Durumu</div>
    <div class="presence-grid">${pItems.map(i=>`<div class="presence-item"><div class="presence-dot ${dp[i.key]?'dot-yes':'dot-no'}">${dp[i.key]?'✓':'✗'}</div>${i.label}</div>`).join('')}</div>
  </div>
  <div class="card">
    <div class="section-label">Neden yapay zeka videosuna ihtiyacın var?</div>
    <ul class="reasons-list">${(r.reasons||[]).map((r,i)=>`<li><span class="reason-num">${i+1}.</span><span>${r}</span></li>`).join('')}</ul>
  </div>
  <div>
    <div class="section-label">Sana özel video fikirleri</div>
    ${(r.video_ideas||[]).map(idea=>`<div class="idea-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><h3>${idea.title}</h3><span class="tag tag-purple" style="flex-shrink:0;font-size:10px">${idea.platform}</span></div>
      ${idea.concept?`<div class="idea-scene">${idea.concept}</div>`:''}
    </div>`).join('')}
  </div>
  <div class="script-box"><h3>✦ İlk adım: Script</h3><p style="margin-top:6px">${r.first_step||'Her harika videonun temeli iyi bir script\'tir.'}</p></div>
  <div class="cta-box">
    <p style="font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Bir sonraki adım</p>
    <h2 style="color:#fff;margin-bottom:10px">Bu fikirleri videoya dönüştür</h2>
    <p>Seekerz'daki yapay zeka video üreticileri markanı tanıyor ve videonu anahtar teslim hazırlıyor.</p>
    <a href="${SEEKERZ_CTA}" target="_blank">Ücretsiz İlan Aç →</a>
  </div>
  <button class="btn-ghost" id="resetBtn">← Yeni analiz yap</button>`;
}
 
function attachHandlers() {
  const pwBtn = document.getElementById('pwBtn');
  if (pwBtn) {
    const go = () => {
      const pw = document.getElementById('pwInput').value.trim();
      if (pw !== APP_PASSWORD) { state.error='Şifre yanlış.'; render(); return; }
      state.error=''; state.screen='form'; render();
    };
    pwBtn.addEventListener('click', go);
    document.getElementById('pwInput').addEventListener('keydown', e => { if(e.key==='Enter') go(); });
  }
  const analyzeBtn = document.getElementById('analyzeBtn');
  if (analyzeBtn) {
    analyzeBtn.addEventListener('click', async () => {
      const name=document.getElementById('nameInput').value.trim();
      const email=document.getElementById('emailInput').value.trim();
      const website=document.getElementById('websiteInput').value.trim();
      if (!name||!email||!website) { state.error='Lütfen tüm alanları doldurun.'; render(); return; }
      if (!email.includes('@')) { state.error='Geçerli bir email girin.'; render(); return; }
      state.name=name; state.email=email; state.website=website; state.error='';
      state.screen='loading'; state.progress=0; state.loadingIdx=0;
      render(); startLoading(); await runAnalysis(name,email,website);
    });
  }
  const resetBtn = document.getElementById('resetBtn');
  if (resetBtn) resetBtn.addEventListener('click', () => { state.screen='form'; state.report=null; state.error=''; render(); });
}
 
function startLoading() {
  let i=0, p=0;
  loadingTimer = setInterval(() => {
    i=(i+1)%LOADING_MSGS.length; p=Math.min(p+13,88);
    state.loadingIdx=i; state.progress=p;
    const m=document.getElementById('loadingMsg');
    const f=document.querySelector('.progress-fill');
    const t=document.querySelector('.loading-wrap > p:last-child');
    if(m) m.textContent=LOADING_MSGS[i];
    if(f) f.style.width=p+'%';
    if(t) t.textContent=Math.round(p)+'%';
  }, 2000);
}
 
function stopLoading() {
  clearInterval(loadingTimer);
  const f=document.querySelector('.progress-fill');
  if(f) f.style.width='100%';
}
 
async function runAnalysis(name, email, website) {
  const userPrompt = `Şu markanın web sitesini analiz et: ${website}\nKişi adı: ${name}\n1. Web sitesini ziyaret et\n2. Sitede video var mı kontrol et\n3. Instagram, TikTok, YouTube linklerini ara\n4. Google/Meta reklam varlığını değerlendir\n5. Ürün/hizmet yapısını anla\nVideo fikirleri oluştururken somut ve sinematik ol.`;
  try {
    const res = await fetch('/api/analyze', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ model:'claude-sonnet-4-5', max_tokens:1000, tools:[{type:'web_search_20250305',name:'web_search'}], system:SYSTEM_PROMPT, messages:[{role:'user',content:userPrompt}] })
    });
    const data = await res.json();
    console.log('[runAnalysis] Full API response:', JSON.stringify(data, null, 2));
    if (data.error) throw new Error(typeof data.error === 'string' ? data.error : JSON.stringify(data.error));
    let jsonText = '';
    for (const block of (data.content||[])) { if(block.type==='text') { jsonText=block.text; } }
    console.log('[runAnalysis] Extracted text:', jsonText);
    if (!jsonText) {
      const blockTypes = (data.content||[]).map(b=>b.type);
      throw new Error(`No text block found. stop_reason=${data.stop_reason} blocks=${JSON.stringify(blockTypes)}`);
    }
    let parsed;
    try {
      const firstBrace = jsonText.indexOf('{');
      const lastBrace = jsonText.lastIndexOf('}');
      if (firstBrace === -1 || lastBrace === -1) throw new Error('JSON objesi bulunamadı: ' + jsonText.substring(0, 100));
      const cleaned = jsonText.substring(firstBrace, lastBrace + 1);
      parsed = JSON.parse(cleaned);
    } catch(parseErr) {
      console.error('[runAnalysis] JSON parse error:', parseErr.message, 'raw text:', jsonText);
      throw parseErr;
    }
    stopLoading();
    setTimeout(() => { state.report={...parsed,name,website}; state.screen='report'; render(); }, 500);
  } catch(e) {
    stopLoading();
    setTimeout(() => { state.error=e.message; state.screen='form'; render(); }, 500);
  }
}
 
function fallbackReport(name, website) {
  return { name, website, score:74, verdict:'var',
    summary:`${website} adresi incelendi. Yapay zeka ile üretilmiş video içerikten ciddi fayda sağlayabileceğiniz görülmektedir.`,
    reasons:['Video içerik tüketimi her yıl %80 artıyor ve rakipleriniz bu trendi kaçırmak istemiyor.','Sosyal medya algoritmaları video içeriklere organik olarak çok daha fazla erişim sağlıyor.','Yapay zeka ile üretilen videolar geleneksel reklam maliyetinin onda birine mal oluyor.'],
    digital_presence:{instagram:true,tiktok:false,youtube:false,website_video:false,active_ads:false},
    video_ideas:[
      {title:'Ürün Hikayesi: 30 Saniyede İkna',platform:'TikTok/Reels',scene:'Kamera masa üzerindeki ürüne yakın açılıyor. Bir el uzanıp alıyor, kullanıyor — yüzde hafif bir gülümseme. Son karede ürün ekrana dolduruyor.',hook:'"Bunu deneyen bir daha eskiye dönmek istemiyor."',why:'Kısa, duygusal ve paylaşılabilir — TikTok algoritmasının sevdiği format.'},
      {title:'"Neden Biz?" — Güven Videosu',platform:'Instagram/YouTube',scene:'Gerçek bir ortamda çekim: ofis, atölye ya da mutfak. Sahici ses tonu, kurumsal olmayan dil.',hook:'"Yüzlerce alternatif var. Neden bizi seçiyorlar?"',why:'Güven oluşturmak satışı hızlandırır.'}
    ],
    first_step:'Önce şunu yazın: izleyici bu videoyu izledikten sonra ne yapmalı? O aksiyondan geriye doğru giderek scripti oluşturun.'
  };
}
 
render();
</script>
</body>
</html>
