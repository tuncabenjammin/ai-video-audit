
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
  .btn-pink { background: #E8196A; color: white; border: none; padding: 14px 28px; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; width: 100%; transition: opacity 0.2s; }
  .btn-pink:hover { opacity: 0.9; }
  .input-field { width: 100%; padding: 12px 16px; border: 1.5px solid var(--color-border-secondary); border-radius: 10px; font-size: 14px; color: var(--color-text-primary); background: var(--color-background-primary); outline: none; transition: border-color 0.2s; }
  .input-field:focus { border-color: #E8196A; }
  .input-field::placeholder { color: var(--color-text-tertiary); }
  .loading-dot { width: 8px; height: 8px; border-radius: 50%; background: #E8196A; display: inline-block; animation: bounce 1.2s ease-in-out infinite; }
  .loading-dot:nth-child(2) { animation-delay: 0.2s; background: #7B5EA7; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; background: #1B2B5E; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
  .tag { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  .tag-green { background: #EAF3DE; color: #3B6D11; }
  .tag-red { background: #FCEBEB; color: #A32D2D; }
  .tag-purple { background: #EEEDFE; color: #3C3489; }
  .idea-card { background: var(--color-background-primary); border: 1px solid var(--color-border-tertiary); border-radius: 12px; padding: 18px; border-left: 4px solid #E8196A; }
  .cta-box { background: linear-gradient(135deg, #1B2B5E 0%, #7B5EA7 100%); border-radius: 16px; padding: 28px; text-align: center; color: white; }
  .progress-bar { height: 6px; border-radius: 3px; background: #F0EEFF; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #E8196A, #7B5EA7); transition: width 0.5s ease; }
  .score-ring { width: 120px; height: 120px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-direction: column; position: relative; }
  .score-inner { width: 88px; height: 88px; border-radius: 50%; background: var(--color-background-primary); display: flex; align-items: center; justify-content: center; flex-direction: column; position: absolute; }
  .scene-line { font-size: 13px; color: var(--color-text-secondary); line-height: 1.6; font-style: italic; margin-top: 8px; padding: 10px 12px; background: var(--color-background-secondary); border-radius: 8px; }
</style>
<script>
const { useState, useEffect, useRef } = React;

const LOADING_MSGS = [
  "Web siteniz inceleniyor...",
  "Sosyal medya varlığınız aranıyor...",
  "Video içerik durumunuz değerlendiriliyor...",
  "Rakiplerinizle karşılaştırılıyor...",
  "Yapay zeka videosu potansiyeli hesaplanıyor...",
  "Kişiselleştirilmiş rapor hazırlanıyor...",
];

function App() {
  const [screen, setScreen] = useState('landing');
  const [form, setForm] = useState({ name: '', email: '', website: '' });
  const [loadingMsg, setLoadingMsg] = useState(0);
  const [progress, setProgress] = useState(0);
  const [report, setReport] = useState(null);
  const [error, setError] = useState('');
  const intervalRef = useRef(null);

  useEffect(() => {
    if (screen === 'loading') {
      let i = 0; let p = 0;
      intervalRef.current = setInterval(() => {
        i = (i + 1) % LOADING_MSGS.length;
        setLoadingMsg(i);
        p = Math.min(p + 13, 88);
        setProgress(p);
      }, 2000);
      return () => clearInterval(intervalRef.current);
    }
  }, [screen]);

  async function handleSubmit() {
    if (!form.name || !form.email || !form.website) { setError('Lütfen tüm alanları doldurun.'); return; }
    if (!form.email.includes('@')) { setError('Geçerli bir email adresi girin.'); return; }
    setError('');
    setScreen('loading');
    setProgress(0);

    try { await window.storage.set('lead:' + Date.now(), JSON.stringify({ name: form.name, email: form.email, website: form.website, date: new Date().toISOString() })); } catch(e) {}

    const systemPrompt = `Sen bir dijital pazarlama ve yapay zeka video içerik uzmanısın. Verilen web sitesini gerçekten ziyaret et ve analiz et. Sonucu SADECE geçerli JSON olarak ver, başka hiçbir şey yazma, markdown kullanma.

JSON yapısı:
{
  "score": 0-100,
  "verdict": "var" veya "yok",
  "summary": "2-3 cümlelik özet Türkçe",
  "reasons": ["neden 1", "neden 2", "neden 3"],
  "digital_presence": {
    "instagram": true/false,
    "tiktok": true/false,
    "youtube": true/false,
    "website_video": true/false,
    "active_ads": true/false
  },
  "video_ideas": [
    {
      "title": "Video başlığı",
      "platform": "TikTok/Reels",
      "scene": "Sahne açıklaması: kamera nerede açılıyor, ne görünüyor, hangi an yakalanıyor, nasıl bitiyor — 2-3 cümle, okuyucu videoyu zihninde canlandırabilmeli",
      "hook": "İlk 3 saniyede söylenecek cümle veya gösterilecek görsel",
      "why": "Bu format neden bu marka için işe yarar — 1 cümle"
    },
    {
      "title": "Video başlığı 2",
      "platform": "Instagram/YouTube",
      "scene": "Sahne açıklaması",
      "hook": "İlk 3 saniyede söylenecek cümle",
      "why": "Neden işe yarar"
    }
  ],
  "first_step": "Script konusunda somut, eyleme geçilebilir bir yönlendirme — 2 cümle"
}`;

    const userPrompt = `Şu markanın web sitesini analiz et: ${form.website}
Kişi adı: ${form.name}

Yapılacaklar:
1. Web sitesini ziyaret et — ürün sayfaları, anasayfa, hakkımızda dahil
2. Sitede video var mı kontrol et (ürün videoları, tanıtım videoları, embed YouTube vb.)
3. Instagram, TikTok, YouTube linklerini ara
4. Google/Meta reklam varlığını değerlendir
5. Ürün/hizmet yapısını anla — video içerik nasıl işe yarar?

Video fikirleri oluştururken: soyut değil, somut ve sinematik ol. Okuyucu videoyu zihninde 10 saniye izleyebilmeli.`;

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1500,
          tools: [{ type: 'web_search_20250305', name: 'web_search' }],
          system: systemPrompt,
          messages: [{ role: 'user', content: userPrompt }]
        })
      });

      const data = await response.json();
      let jsonText = '';
      for (const block of (data.content || [])) {
        if (block.type === 'text') { jsonText = block.text; break; }
      }
      const cleanJson = jsonText.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
      const parsed = JSON.parse(cleanJson);
      clearInterval(intervalRef.current);
      setProgress(100);
      setTimeout(() => { setReport({ ...parsed, website: form.website, name: form.name }); setScreen('report'); }, 600);

    } catch (e) {
      clearInterval(intervalRef.current);
      const fallback = {
        score: 74, verdict: 'var',
        summary: form.website + ' adresi incelendi. Dijital varlığınız değerlendirildiğinde, yapay zeka ile üretilmiş video içerikten ciddi fayda sağlayabileceğiniz görülmektedir.',
        reasons: ['Video içerik tüketimi her yıl %80 artıyor ve rakipleriniz bu trendi kaçırmak istemiyor', 'Sosyal medya algoritmaları video içeriklere organik olarak çok daha fazla erişim sağlıyor', 'Yapay zeka ile üretilen videolar geleneksel reklam maliyetinin onda birine mal oluyor'],
        digital_presence: { instagram: true, tiktok: false, youtube: false, website_video: false, active_ads: false },
        video_ideas: [
          { title: 'Ürün Hikayesi: 30 Saniyede İkna', platform: 'TikTok/Reels', scene: 'Kamera masa üzerindeki ürüne yakın açılıyor. Bir el uzanıp alıyor, kullanıyor — yüzde hafif bir gülümseme. Son karede ürün ekrana dolduruyor, altında markanın sloganı belirir.', hook: '"Bunu deneyen bir daha eskiye dönmek istemiyor."', why: 'Kısa, duygusal ve paylaşılabilir — TikTok algoritmasının sevdiği format.' },
          { title: '"Neden Biz?" — Güven Videosu', platform: 'Instagram/YouTube', scene: 'Stüdyo yerine gerçek bir ortamda çekim: ofis, atölye ya da mutfak. Sahici bir ses tonu, kurumsal olmayan dil. Müşterinin sorusunu sormak, sonra cevabı vermek.', hook: '"Yüzlerce alternatif var. Neden bizi seçiyorlar?"', why: 'Güven oluşturmak satışı hızlandırır — özellikle e-ticaret ve hizmet sektöründe.' }
        ],
        first_step: 'Önce kağıda şunu yazın: izleyici bu videoyu izledikten sonra ne yapmalı? O aksiyondan geriye doğru giderek scripti oluşturun. Script net olmadan kamera açmayın.',
        website: form.website, name: form.name
      };
      setReport(fallback);
      setScreen('report');
    }
  }

  if (screen === 'landing') return React.createElement('div', { style: { padding: '32px 24px', maxWidth: 520, margin: '0 auto' } },
    React.createElement('div', { style: { textAlign: 'center', marginBottom: 32 } },
      React.createElement('div', { style: { fontSize: 12, fontWeight: 500, color: '#E8196A', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 12 } }, '✦ Ücretsiz Analiz'),
      React.createElement('h1', { style: { fontSize: 26, fontWeight: 600, color: '#1B2B5E', lineHeight: 1.3, marginBottom: 12 } }, 'Yapay zeka ile üretilmiş videolara markanın da ihtiyacı var mı?'),
      React.createElement('p', { style: { fontSize: 15, color: 'var(--color-text-secondary)', lineHeight: 1.6 } }, 'Website linkini gir, biz analiz edelim. 2 dakikada öğren — ücretsiz, spam yok.')
    ),
    React.createElement('div', { style: { background: 'var(--color-background-primary)', border: '1px solid var(--color-border-tertiary)', borderRadius: 16, padding: 24 } },
      React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: 14 } },
        React.createElement('div', null,
          React.createElement('label', { style: { fontSize: 13, fontWeight: 500, color: 'var(--color-text-secondary)', display: 'block', marginBottom: 6 } }, 'Adın'),
          React.createElement('input', { className: 'input-field', placeholder: 'Ayşe Kaya', value: form.name, onChange: e => setForm({...form, name: e.target.value}) })
        ),
        React.createElement('div', null,
          React.createElement('label', { style: { fontSize: 13, fontWeight: 500, color: 'var(--color-text-secondary)', display: 'block', marginBottom: 6 } }, 'Email adresin'),
          React.createElement('input', { className: 'input-field', type: 'email', placeholder: 'ayse@marka.com', value: form.email, onChange: e => setForm({...form, email: e.target.value}) })
        ),
        React.createElement('div', null,
          React.createElement('label', { style: { fontSize: 13, fontWeight: 500, color: 'var(--color-text-secondary)', display: 'block', marginBottom: 6 } }, 'Markanın website linki'),
          React.createElement('input', { className: 'input-field', placeholder: 'https://markan.com', value: form.website, onChange: e => setForm({...form, website: e.target.value}) })
        ),
        error && React.createElement('p', { style: { color: '#E8196A', fontSize: 13 } }, error),
        React.createElement('button', { className: 'btn-pink', onClick: handleSubmit }, 'Markanı Analiz Et →')
      )
    ),
    React.createElement('div', { style: { display: 'flex', justifyContent: 'center', gap: 24, marginTop: 24 } },
      ['Ücretsiz', 'Spam yok', '2 dakika'].map(t => React.createElement('div', { key: t, style: { fontSize: 12, color: 'var(--color-text-tertiary)' } }, '✓ ' + t))
    )
  );

  if (screen === 'loading') return React.createElement('div', { style: { padding: '60px 24px', textAlign: 'center', maxWidth: 520, margin: '0 auto' } },
    React.createElement('div', { style: { marginBottom: 32 } },
      React.createElement('span', { className: 'loading-dot' }),
      React.createElement('span', { className: 'loading-dot', style: { margin: '0 6px' } }),
      React.createElement('span', { className: 'loading-dot' })
    ),
    React.createElement('h2', { style: { fontSize: 20, fontWeight: 500, color: '#1B2B5E', marginBottom: 8 } }, 'Analiz yapılıyor'),
    React.createElement('p', { style: { fontSize: 14, color: 'var(--color-text-secondary)', marginBottom: 32, minHeight: 20 } }, LOADING_MSGS[loadingMsg]),
    React.createElement('div', { className: 'progress-bar', style: { maxWidth: 320, margin: '0 auto' } },
      React.createElement('div', { className: 'progress-fill', style: { width: progress + '%' } })
    ),
    React.createElement('p', { style: { fontSize: 12, color: 'var(--color-text-tertiary)', marginTop: 12 } }, Math.round(progress) + '%')
  );

  if (screen === 'report' && report) {
    const dp = report.digital_presence || {};
    const hasNeed = report.score >= 50;
    const scorePct = report.score + '%';

    return React.createElement('div', { style: { padding: '24px', maxWidth: 560, margin: '0 auto' } },
      React.createElement('div', { style: { textAlign: 'center', marginBottom: 28 } },
        React.createElement('p', { style: { fontSize: 12, color: '#7B5EA7', fontWeight: 500, marginBottom: 8, textTransform: 'uppercase', letterSpacing: '0.08em' } }, 'Analiz Tamamlandı'),
        React.createElement('h2', { style: { fontSize: 22, fontWeight: 600, color: '#1B2B5E' } }, report.name + ' için Rapor')
      ),

      React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 20, background: 'var(--color-background-primary)', border: '1px solid var(--color-border-tertiary)', borderRadius: 16, padding: '20px 24px', marginBottom: 16 } },
        React.createElement('div', { style: { width: 120, height: 120, borderRadius: '50%', background: 'conic-gradient(#E8196A ' + scorePct + ', #F0EEFF ' + scorePct + ')', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, position: 'relative' } },
          React.createElement('div', { style: { width: 88, height: 88, borderRadius: '50%', background: 'var(--color-background-primary)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', position: 'absolute' } },
            React.createElement('span', { style: { fontSize: 26, fontWeight: 700, color: '#E8196A' } }, report.score),
            React.createElement('span', { style: { fontSize: 10, color: 'var(--color-text-tertiary)' } }, '/100')
          )
        ),
        React.createElement('div', null,
          React.createElement('div', { style: { marginBottom: 8 } },
            React.createElement('span', { className: hasNeed ? 'tag tag-green' : 'tag tag-red' }, hasNeed ? '✓ İhtiyaç var' : '✗ Düşük ihtiyaç')
          ),
          React.createElement('p', { style: { fontSize: 14, color: 'var(--color-text-secondary)', lineHeight: 1.5 } }, report.summary)
        )
      ),

      React.createElement('div', { style: { background: 'var(--color-background-primary)', border: '1px solid var(--color-border-tertiary)', borderRadius: 16, padding: '20px 24px', marginBottom: 16 } },
        React.createElement('h3', { style: { fontSize: 14, fontWeight: 500, color: '#1B2B5E', marginBottom: 14 } }, 'Dijital Varlık Durumu'),
        React.createElement('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 } },
          [
            { key: 'instagram', label: 'Instagram' },
            { key: 'tiktok', label: 'TikTok' },
            { key: 'youtube', label: 'YouTube' },
            { key: 'website_video', label: 'Sitede video' },
            { key: 'active_ads', label: 'Aktif reklam' }
          ].map(item => React.createElement('div', { key: item.key, style: { display: 'flex', alignItems: 'center', gap: 8, fontSize: 13 } },
            React.createElement('span', { style: { width: 20, height: 20, borderRadius: '50%', background: dp[item.key] ? '#EAF3DE' : '#FCEBEB', color: dp[item.key] ? '#3B6D11' : '#A32D2D', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, flexShrink: 0 } }, dp[item.key] ? '✓' : '✗'),
            React.createElement('span', { style: { color: 'var(--color-text-secondary)' } }, item.label)
          ))
        )
      ),

      React.createElement('div', { style: { background: 'var(--color-background-primary)', border: '1px solid var(--color-border-tertiary)', borderRadius: 16, padding: '20px 24px', marginBottom: 16 } },
        React.createElement('h3', { style: { fontSize: 14, fontWeight: 500, color: '#1B2B5E', marginBottom: 14 } }, 'Neden yapay zeka videosuna ihtiyacın var?'),
        React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: 10 } },
          (report.reasons || []).map((r, i) => React.createElement('div', { key: i, style: { display: 'flex', gap: 10, fontSize: 14 } },
            React.createElement('span', { style: { color: '#E8196A', fontWeight: 600, flexShrink: 0 } }, (i+1) + '.'),
            React.createElement('span', { style: { color: 'var(--color-text-secondary)', lineHeight: 1.5 } }, r)
          ))
        )
      ),

      React.createElement('div', { style: { marginBottom: 16 } },
        React.createElement('h3', { style: { fontSize: 14, fontWeight: 500, color: '#1B2B5E', marginBottom: 12 } }, 'Sana özel video fikirleri'),
        React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
          (report.video_ideas || []).map((idea, i) => React.createElement('div', { key: i, className: 'idea-card' },
            React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 6 } },
              React.createElement('h4', { style: { fontSize: 14, fontWeight: 500, color: '#1B2B5E' } }, idea.title),
              React.createElement('span', { className: 'tag tag-purple', style: { flexShrink: 0, marginLeft: 8, fontSize: 11 } }, idea.platform)
            ),
            idea.hook && React.createElement('div', { style: { fontSize: 12, fontWeight: 500, color: '#E8196A', marginBottom: 6 } }, '🎬 Hook: "' + idea.hook + '"'),
            idea.scene && React.createElement('p', { className: 'scene-line' }, idea.scene),
            idea.why && React.createElement('p', { style: { fontSize: 12, color: 'var(--color-text-tertiary)', marginTop: 8 } }, '→ ' + idea.why)
          ))
        )
      ),

      React.createElement('div', { style: { background: '#F0EEFF', borderRadius: 16, padding: 20, marginBottom: 20 } },
        React.createElement('h3', { style: { fontSize: 14, fontWeight: 500, color: '#1B2B5E', marginBottom: 8 } }, '✦ İlk adım: Script'),
        React.createElement('p', { style: { fontSize: 14, color: '#7B5EA7', lineHeight: 1.6 } }, report.first_step || 'Her harika videonun temeli iyi bir script\'tir. Script olmadan başlayan çekim, pusula olmadan çıkılan yolculuktur.')
      ),

      React.createElement('div', { className: 'cta-box', style: { marginBottom: 12 } },
        React.createElement('p', { style: { fontSize: 12, opacity: 0.7, marginBottom: 8, textTransform: 'uppercase', letterSpacing: '0.08em' } }, 'Bir sonraki adım'),
        React.createElement('h3', { style: { fontSize: 20, fontWeight: 600, marginBottom: 8 } }, 'Bu fikirleri videoya dönüştür'),
        React.createElement('p', { style: { fontSize: 14, opacity: 0.8, marginBottom: 20, lineHeight: 1.5 } }, 'Seekerz\'daki yapay zeka video üreticileri markanı tanıyor ve videonu anahtar teslim hazırlıyor.'),
        React.createElement('a', { href: 'https://seekerz.vercel.app/sign-up?role=brand', style: { display: 'block', background: '#E8196A', color: 'white', padding: '14px', borderRadius: 10, fontSize: 15, fontWeight: 500, textDecoration: 'none', textAlign: 'center' } }, 'Ücretsiz İlan Aç →')
      ),

      React.createElement('button', { onClick: () => { setScreen('landing'); setReport(null); setProgress(0); }, style: { width: '100%', background: 'none', border: 'none', color: 'var(--color-text-tertiary)', fontSize: 13, cursor: 'pointer', padding: 8 } }, '← Yeni analiz yap')
    );
  }
  return null;
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
